<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;background:#111;overflow:hidden"><div id="player"></div>
<script>
let player;
const send = value => window.webkit.messageHandlers.player.postMessage(value);
function onYouTubeIframeAPIReady() {
 player = new YT.Player('player', {width:'100%',height:'100%',videoId:'nKVZBKoB6P4',
  playerVars:{playsinline:1,origin:'https://www.youtube.com',rel:0},
  events:{onReady:()=>send({ready:true}),onStateChange:e=>send({state:e.data}),onError:e=>send({error:e.data}),
   onAutoplayBlocked:()=>send({error:'请点击播放'})}});
}
</script><script src="https://www.youtube.com/iframe_api"></script>
<style>html,body,#player{width:100%;height:100%}</style></body></html>
